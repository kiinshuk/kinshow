name: Update contributors

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch contributors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_FETCH: '1'
        run: node scripts/fetch-contributors.mjs

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/contributors.json
          if git diff --cached --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git commit -m "chore: refresh contributors list"
          if git push origin HEAD:main; then
            echo "Pushed to main."
            exit 0
          fi
          echo "Direct push blocked by branch protection."
          git checkout -b bot/refresh-contributors
          if git push --force origin HEAD:refs/heads/bot/refresh-contributors; then
            echo "Branch updated."
          else
            echo "::warning::Could not update bot/refresh-contributors either."
            exit 0
          fi
          if gh pr create \
            --head bot/refresh-contributors \
            --base main \
            --title "chore: refresh contributors list" \
            --body "Automated hourly refresh of the About page contributors data (avatars and contribution counts). Generated by scripts/fetch-contributors.mjs."; then
            echo "PR created."
          else
            echo "::warning::PR creation blocked (enable Settings > Actions > General > Allow GitHub Actions to create and approve pull requests). Branch bot/refresh-contributors has the update; landing it is not urgent because every build regenerates this data via prebuild."
            exit 0
          fi
